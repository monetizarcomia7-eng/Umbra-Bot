<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0F13"/>
      <stop offset="100%" stop-color="#15171C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative mark (faded, top-right) -->
  <g transform="translate(900 340) scale(3.4)" opacity="0.12">
    <path d="M 18 18 V 60 A 32 32 0 0 0 82 60 V 18 H 64 V 60 A 14 14 0 0 1 36 60 V 18 Z" fill="#f4f4f8"/>
    <rect x="14" y="42" width="72" height="3.5" rx="2" fill="#7C5CFF"/>
  </g>

  <!-- Logo lockup (top-left) -->
  <g transform="translate(72 56)">
    <path d="M 18 18 V 60 A 32 32 0 0 0 82 60 V 18 H 64 V 60 A 14 14 0 0 1 36 60 V 18 Z" fill="#f4f4f8" transform="scale(0.42)"/>
    <rect x="14" y="42" width="72" height="3.5" rx="2" fill="#7C5CFF" transform="scale(0.42)"/>
    <text x="58" y="32" font-family="Space Grotesk, system-ui, sans-serif" font-weight="600" font-size="26" letter-spacing="-1.04" fill="#f4f4f8">umbra<tspan fill="#7C5CFF">.</tspan>bot</text>
  </g>

  <!-- Purple accent line -->
  <rect x="72" y="360" width="56" height="4" rx="2" fill="#7C5CFF"/>

  <!-- Headline -->
  <text x="72" y="440" font-family="Space Grotesk, system-ui, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.5" fill="#f4f4f8">Venda no Telegram</text>
  <text x="72" y="524" font-family="Space Grotesk, system-ui, sans-serif" font-weight="700" font-size="74" letter-spacing="-2.5" fill="#f4f4f8">no <tspan fill="#7C5CFF">automático.</tspan></text>

  <!-- Subtext -->
  <text x="72" y="574" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#a0a0ab" letter-spacing="-0.3">Sem mensalidade. Só paga quando vende.</text>
</svg>
